<style>
  *{padding:0; margin:0;}
  body{
    background:radial-gradient(#F600FF,black);

    color:white;
  }
  header{
    padding:15px;
    background:#252327;
    color:#26C3FF;
    text-shadow:0 0 10px , 0 0 20px #9FE5FF,0 0 30px #9FE5FF;
  }
  span{

  }
  .card{

text-align:center;

  input{

    padding:10px;
    width:80%;
    border:2px solid #00B1FF;
    border-radius:15px;
    outline-color:#00B1FF;
    color:white;
    font-size:18px;
    letter-spacing:3px;
    font-family: 'Ragdhani',monospace ;
  }
  input:hover{

  }
  input::placeholder{
    background:linear-gradient(70deg,#E551FF,#007DFF); 
    font-size:18px;
    letter-spacing:3px;
    background-clip:text; 
    -webkit-text-fill-color: transparent;
    transition:2s ease;
    animation:change 2s infinite alternate;

  @keyframes change{

     document.getElementById('loaDiv').style.display='none'

</html>
